<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    svg { font-family: 'Segoe UI', Ubuntu, Sans-Serif; user-select: none; }
    text { text-anchor: middle; }
