    .date { fill: #8b949e; font-size: 12px; }
    .divider { stroke: #8b949e; stroke-width: 1px; stroke-opacity: 0.3; }
    .ring { stroke: #8B5CF6; stroke-width: 5px; fill: none; }
    .fire { fill: #6C63FF; }
