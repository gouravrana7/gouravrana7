    .area { stroke: none; fill: #6C63FF; fill-opacity: 0.1; }
    /* Resting state is the finished drawing, so the graph is still visible if a
       renderer ignores CSS animation. The keyframes only replay the reveal. */
    .line { fill: none; stroke: #6C63FF; stroke-width: 4px; stroke-dasharray: 5000; stroke-dashoffset: 0; animation: dash 5s ease-in-out forwards; }
